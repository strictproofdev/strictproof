[project]
name = "strictproof"
version = "0.1.0"
description = "Execution-control gateway for agentic systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
